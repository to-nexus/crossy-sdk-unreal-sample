; iOS-only Xcode project settings.
;
; Unreal 5.7 regenerates Intermediate/ProjectFilesIOS during `make ios`.
; Keeping these values in platform config prevents Xcode's manual
; Signing & Capabilities selection from being reset to an empty team.

[/Script/MacTargetPlatform.XcodeProjectSettings]
bUseAutomaticCodeSigning=True
CodeSigningTeam=YC94S4Z6CS
BundleIdentifier=com.nexus.crossx.sdk.unrealsample.ios

[/Script/IOSRuntimeSettings.IOSRuntimeSettings]
bAutomaticSigning=True
IOSTeamID=YC94S4Z6CS
