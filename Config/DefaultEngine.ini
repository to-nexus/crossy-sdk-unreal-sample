; ----------------------------------------------------------------------------
; WORKAROUND (remove once SDK >= beta.10 / ramp >= beta.8 is in use)
;
; The SDK plugin's UPL_Android.xml injects `crossx-{ProjectId}` and
; `ramp-{ProjectId}` deep-link intent-filters into the GameActivity, but
; in the current beta release that block runs silently (no trace output,
; no manifest mutation) on this UE 5.7 + Mac toolchain. Without these
; intent-filters the OAuth provider (Google etc.) successfully completes
; sign-in in the system browser, but the `crossx-…://callback` URL is
; never routed back to the app — so the user is left on the browser tab
; and the dApp keeps spinning.
;
; The block below uses Unreal's ini-driven `+ExtraActivitySettings=`
; mechanism to insert the same intent-filters as **child elements** of
; the GameActivity at manifest-merge time, without going through UPL.
; (Note: `ExtraActivityNodeTags` adds *attributes* to <activity>, while
; `ExtraActivitySettings` adds *child elements* like <intent-filter>.)
;
; Each entry must be a single line of inline XML; the engine pastes it
; verbatim inside the GameActivity element.
;
; Replace `dde6d3ac5d67d3bc8263692182476f50` with your own ProdProjectId
; if you fork this sample. Once the upstream UPL fix ships, delete this
; block — the SDK plugin will inject the schemes automatically.
; ----------------------------------------------------------------------------
+ExtraActivitySettings=<intent-filter android:autoVerify="false"><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="crossx-dde6d3ac5d67d3bc8263692182476f50"/></intent-filter>
+ExtraActivitySettings=<intent-filter android:autoVerify="false"><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="ramp-dde6d3ac5d67d3bc8263692182476f50"/></intent-filter>

