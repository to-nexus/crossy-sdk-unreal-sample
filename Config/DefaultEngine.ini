; ============================================================================
; iOS — bundle identifier + minimum OS version
;
;  • The CROSSx SDK plugin requires iOS 15.0+ (enforced by
;    CROSSxSdkUnrealPlugin.Build.cs). Lower values will be ignored.
;  • The bundle id below is the published value used by the SDK team's
;    test signing profile. Replace it with your own reverse-DNS id before
;    submitting a build to App Store Connect / TestFlight.
;  • BundleDisplayName / BundleName are shown on the home screen and
;    inside SDK modals as a fallback.
;  • Custom URL schemes (crossx-{ProjectId}, ramp-{ProjectId}) are
;    auto-injected by CROSSxSdkUnrealPlugin's UPL — do NOT add them here
;    or you will end up with duplicates.
; ============================================================================
[/Script/IOSRuntimeSettings.IOSRuntimeSettings]
