BundleDisplayName=CROSSx Unreal Sample
BundleName=CrossySdkUnrealSamp
MinimumiOSVersion=IOS_15
bSupportsPortraitOrientation=True
bSupportsUpsideDownOrientation=False
bSupportsLandscapeLeftOrientation=True
bSupportsLandscapeRightOrientation=True
bSupportsITunesFileSharing=False
bSupportsFilesApp=False

; ============================================================================
; Android — package name + SDK levels
;
;  • Package name must match adb's `am start -n <pkg>/<activity>` argument
;    used by `make run-android`. Keep it in sync with the Makefile's
;    ANDROID_PACKAGE variable.
;  • MinSDKVersion=24 matches the SDK's documented requirement (Android 7+).
;  • Permissions and intent-filters for the deep-link schemes are added
;    by the SDK plugin's UPL XML at packaging time.
; ============================================================================
