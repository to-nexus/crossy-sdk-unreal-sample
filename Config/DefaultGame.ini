[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=B8539EE1BB42E63A1EA29C885B6970CB

; ============================================================================
; Packaging — make sure UI + Maps assets land in the cooked build.
;
; ADappGameMode.TestPanelWidgetClass is a TSoftClassPtr loaded at runtime
; from an INI path (`/Game/UI/WBP_DappTestPanel.WBP_DappTestPanel_C`). Soft
; class refs declared only via INI are NOT followed by the cooker's hard
; reference walk, so the WBP and any dependencies (DT_DappStrings, etc.)
; are silently dropped from packaged builds — which is why PIE works but
; an installed APK shows a black viewport with only the default mobile
; HUD visible.
;
; Forcing /Game/UI and /Game/Maps into DirectoriesToAlwaysCook plugs the
; gap without requiring external teams to convert the soft ref into a
; hard ref. Add additional folders here if you place your dApp assets
; outside these two roots.
; ============================================================================
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysCook=(Path="/Game/UI")
+DirectoriesToAlwaysCook=(Path="/Game/Maps")
; DT_DappStrings.uasset is loaded by UDappLocalizationSubsystem via LoadObject
; (soft ref). Without this entry the asset is stripped from the APK and every
; call to GetText() falls through to "<missing:%s>" — visible on device as
; `<missing:sample.auth.success>` etc. Editor PIE still works because the
; asset lives on disk.
+DirectoriesToAlwaysCook=(Path="/Game/Localization")

; ============================================
; CROSSx SDK  (configured via UCROSSxSdkSettings / UDeveloperSettings)
;
; Preferred way to edit these values:
;   Editor -> Project Settings -> Plugins -> CROSSx SDK
;
; Fields written by the settings panel:
;   ProdProjectId   ← *required* before building for iOS / Android
;   (DevProjectId / StageProjectId exist in the internal SDK source but
;    are stripped from distributed plugin packages; external dApps only
;    see ProdProjectId and the default Environment = Prod.)
;
; Deep Link schemes `crossx-{ProjectId}` and `ramp-{ProjectId}` are
; auto-injected into iOS Info.plist / Android AndroidManifest.xml at
; build time by the plugin's UPL scripts, using the value below.
;
; Ramp SDK does NOT need a separate INI section — its ProjectId is
; provided at runtime via FCROSSxRampConfig.ProjectId, which is normally
; populated from this same value.
; ============================================
[/Script/CROSSxSdkUnrealPlugin.CROSSxSdkSettings]
ProdProjectId=dde6d3ac5d67d3bc8263692182476f50
; ----------------------------------------------------------------------------
; WORKAROUND (remove once SDK >= beta.10 / ramp >= beta.8 is in use)
; The SDK plugin's Android/iOS UPL XMLs read `ProjectId=` (legacy single-key
; schema) when injecting the deep link intent-filter / CFBundleURLTypes used
; for OAuth callbacks. The newer multi-environment schema (ProdProjectId=, …)
; is understood by Build.cs but not by the UPL files yet, so on a Prod-only
; sample build the Android manifest ends up missing `crossx-{ProjectId}` and
; Google / Apple OAuth callbacks never reach the app (login looks frozen).
;
; Mirroring the value into the legacy key restores the intent-filter on the
; current SDK release. The follow-up SDK fix teaches the UPL files to prefer
; ProdProjectId and falls back to this legacy key, after which this line
; becomes redundant and should be deleted.
; ----------------------------------------------------------------------------
ProjectId=dde6d3ac5d67d3bc8263692182476f50

; ============================================
; Dapp Game Mode — auto-bootstrap defaults
;
; The C++ ADappGameMode pre-fills these in its constructor; this section is
; here so external teams can override the conventional asset paths from
; Project Settings (Maps & Modes) or by editing this file directly, without
; subclassing the GameMode in Blueprint.
;
;   TestPanelWidgetClass : soft ref to WBP_DappTestPanel (created per
;                          SAMPLE_WIDGET_GUIDE.md §2). The default below
;                          assumes the conventional path /Game/UI/.
;
; If you place the WBP elsewhere, update the path or create BP_DappGameMode
; (subclass) and override there.
; ============================================
Environment=Prod

[/Script/CrossySdkUnrealSamp.DappGameMode]
