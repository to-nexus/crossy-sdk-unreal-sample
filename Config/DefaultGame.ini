; ============================================
; CROSSx SDK  (configured via UCROSSxSdkSettings / UDeveloperSettings)
;
; Preferred way to edit these values:
;   Editor -> Project Settings -> Plugins -> CROSSx SDK
;
; Fields written by the settings panel:
;   ProdProjectId   ← *required* before building for iOS / Android
;   (DevProjectId / StageProjectId exist in the internal SDK source but
;    are stripped from distributed plugin packages; external dApps only
;    see ProdProjectId and the default Environment = Prod.)
;
; Deep Link schemes `crossx-{ProjectId}` and `ramp-{ProjectId}` are
; auto-injected into iOS Info.plist / Android AndroidManifest.xml at
; build time by the plugin's UPL scripts, using the value below.
;
; Ramp SDK does NOT need a separate INI section — its ProjectId is
; provided at runtime via FCROSSxRampConfig.ProjectId, which is normally
; populated from this same value.
; ============================================
[/Script/CROSSxSdkUnrealPlugin.CROSSxSdkSettings]
